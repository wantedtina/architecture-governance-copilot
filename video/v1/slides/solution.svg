<text x="115" y="851" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#70e545">CONFLUENCE REMAINS THE SI SOURCE OF TRUTH</text>
<text x="115" y="896" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#fff">The app produces drafts and suggested changes; it does not write to or edit Confluence.</text>
<text x="115" y="934" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#c7d8e5">Users decide what to use, then write and update the SI themselves in Confluence.</text>
<text x="90" y="1035" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#66727d">ARCHITECTURE GOVERNANCE COPILOT  ·  ACCELERATE 3.0</text>

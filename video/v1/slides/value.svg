<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#F7F8FA"/><rect width="1310" height="10" fill="#0473EA"/><rect x="1310" width="610" height="10" fill="#38D200"/>
<text x="90" y="87" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0473ea">WHAT WE STRENGTHENED</text>
<text x="90" y="154" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#061D33">From a traceable record to visible, controlled action</text>
<text x="90" y="210" font-family="Arial,sans-serif" font-size="27" font-weight="400" fill="#66727d">Responding to judge feedback through demonstrated behavior.</text>
<rect x="90" y="330" width="550" height="350" rx="14" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="2"/>
<text x="118" y="393" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#061D33">Visible human edits</text>
<text x="118" y="466" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#526a7b">Owner changes and exclusions</text>
<text x="118" y="503" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#526a7b">Explicit confirmation before outputs</text>
<rect x="680" y="330" width="550" height="350" rx="14" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="2"/>
<text x="708" y="393" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#061D33">Evidence through outputs</text>
<text x="708" y="466" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#526a7b">Original quote → reviewed action</text>
<text x="708" y="503" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#526a7b">Minutes and work item stay traceable</text>
<rect x="1270" y="330" width="550" height="350" rx="14" fill="#FFFFFF" stroke="#D8E2EC" stroke-width="2"/>
<text x="1298" y="393" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#061D33">Consistency and delivery</text>
<text x="1298" y="466" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#526a7b">Changed inputs invalidate outputs</text>
<text x="1298" y="503" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#526a7b">Preview → Confirm → Create → Verify</text>
<rect x="90" y="765" width="1740" height="170" rx="14" fill="#061d33" stroke="#061d33" stroke-width="2"/>
<text x="120" y="817" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#70e545">Expected value</text>
<text x="120" y="863" font-family="Arial,sans-serif" font-size="34" font-weight="400" fill="#fff">Less repeated reconstruction. Easier verification.</text>
<text x="120" y="909" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#c7d8e5">Business validation is the next step; benefits have not been quantified.</text>
<text x="90" y="1035" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#66727d">ARCHITECTURE GOVERNANCE COPILOT  ·  ACCELERATE 3.0</text>
</svg>